name: Something went wrong
description: Prune crashed, got stuck, couldn't connect, or did something you didn't expect.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Please don't attach screenshots of your photos, chats or payments**: this page is public. Describe what you saw in words instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, and what Prune did.
      placeholder: I pressed Clean on Similar photos and the window closed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The clean-up to finish and show how much space was freed.
  - type: dropdown
    id: where
    attributes:
      label: Where in Prune?
      options:
        - Connecting the phone (setup screen)
        - Reading the phone
        - The photo check
        - Home screen
        - Review
        - Cleaning or Undo
        - Installing or starting Prune
        - Somewhere else
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy S23, Android 14
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11
  - type: input
    id: version
    attributes:
      label: Prune version
      description: Shown in the installer name, or in Prune.exe → Properties → Details.
      placeholder: 1.0.0
