name: declutter
description: "Prune: frees space on an Android phone from a Windows laptop, safely."
publish_to: 'none'
version: 1.0.2

environment:
  sdk: ^3.13.5

dependencies:
  declutter_engine:
    path: ../../packages/engine
  declutter_store:
    path: ../../packages/store
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  phone_link:
    path: ../../packages/phone_link
  vision_helper:
    path: ../../packages/vision_helper

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
